[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-project"
version = "0.2.0"
description = "Traceable desktop robotic-arm driver, vision and task development"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyserial==3.5"]

[project.optional-dependencies]
vision = ["opencv-python==4.14.0.94", "numpy==2.5.4"]
dev = ["ruff==0.17.3"]

[project.scripts]
arm-control = "arm_project.cli.arm_cli:main"
arm-read = "arm_project.cli.read_arm_state:main"
arm-calibration = "arm_project.cli.calibration_prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "runs", "artifacts", "firmware"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.arm-project]
hardware-tests-automatic = false
