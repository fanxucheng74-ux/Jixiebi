name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[vision,dev]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Formatting
        run: python -m ruff format --check src tests tools
      - name: Offline automated tests
        run: python -m unittest discover -s tests -v
      - name: Offline plan example
        run: python -m arm_project.cli.arm_cli --plan data/unified_read_capture.json
