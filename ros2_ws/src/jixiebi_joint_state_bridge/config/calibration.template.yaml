# 复制到自己的参数文件。按本机关节角零位及 URDF 正轴方向，分别记录两个静止姿态的回读 P 与外测角度。
# servo_id=-1 表示尚未标定；至少填全一个关节才能启动。没有给角度或 P 填入示范数字。
joint_state_bridge:
  ros__parameters:
    base_yaw:
      servo_id: -1  # 实测完成填 0；其余三关节依次为 1、2、3。
      # p_a:           # 整数，第一姿态实读 P，协议值 500～2500
      # angle_a_deg:   # 小数，第一姿态相对于关节零位的有符号外测角，单位度
      # p_b:           # 整数，第二姿态实读 P；与 p_a 至少相差 2 P
      # angle_b_deg:   # 小数，第二姿态的有符号外测角；与第一角不同
    shoulder_pitch:
      servo_id: -1  # 实测完成填 1，并在本层填写同名的四个端点字段。
    elbow_flex:
      servo_id: -1  # 实测完成填 2，并在本层填写同名的四个端点字段。
    wrist_pitch:
      servo_id: -1  # 实测完成填 3，并在本层填写同名的四个端点字段。
