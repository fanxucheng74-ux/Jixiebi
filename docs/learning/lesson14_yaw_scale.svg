<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="297mm" height="210mm" viewBox="0 0 297 210" role="img"
     aria-labelledby="title description" lang="zh-CN">
  <title id="title">第十四课 · 底座俯视角度纸</title>
  <desc id="description">A4 横向打印。半圆从纸面左侧正九十度，经正前方零度，到右侧负九十度。
    每一度有刻线。底座转轴投影对准中心十字，右下方校尺长一百毫米。</desc>
  <style>
    @page { size: A4 landscape; margin: 0; }
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; fill: #20262b; }
    .small { font-size: 3.7px; }
    .note { font-size: 4.2px; }
    .numbers { font: bold 4.65px Arial, sans-serif; text-anchor: middle; }
    .numbers text { font: inherit; }
  </style>
  <defs>
    <!-- 刻线共用距中心 111 mm 的外端；同一组按 10° 重复，短中长线分别表示 1/5/10°。 -->
    <path id="one" d="M 148.5 40.5 v 2.9" stroke-width="0.22"/>
    <path id="five" d="M 148.5 40.5 v 4.8" stroke-width="0.36"/>
    <path id="ten" d="M 148.5 40.5 v 6.5" stroke-width="0.48"/>
    <g id="ten_degrees">
      <use xlink:href="#ten"/>
      <use xlink:href="#one" transform="rotate(1 148.5 151.5)"/>
      <use xlink:href="#one" transform="rotate(2 148.5 151.5)"/>
      <use xlink:href="#one" transform="rotate(3 148.5 151.5)"/>
      <use xlink:href="#one" transform="rotate(4 148.5 151.5)"/>
      <use xlink:href="#five" transform="rotate(5 148.5 151.5)"/>
      <use xlink:href="#one" transform="rotate(6 148.5 151.5)"/>
      <use xlink:href="#one" transform="rotate(7 148.5 151.5)"/>
      <use xlink:href="#one" transform="rotate(8 148.5 151.5)"/>
      <use xlink:href="#one" transform="rotate(9 148.5 151.5)"/>
    </g>
  </defs>
  <rect width="297" height="210" fill="#fff"/>
  <text x="14" y="15.5" font-size="7" font-weight="bold">底座俯视角度纸</text>
  <text x="283" y="15.2" text-anchor="end" class="note">第十四课　｜　A4 横向</text>
  <text x="14" y="24" class="note">由上往下看，固定基座的正前方为 0°。向左转读正角，向右转读负角。</text>

  <!-- x 向右、y 向下；绕中心向纸面左侧转是正角，因此左侧刻度标“+”。 -->
  <g fill="none" stroke="#20262b" stroke-linecap="butt">
    <path d="M 37.5 151.5 A 111 111 0 0 1 259.5 151.5" stroke-width="0.35"/>
    <use xlink:href="#ten_degrees" transform="rotate(-90 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(-80 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(-70 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(-60 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(-50 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(-40 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(-30 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(-20 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(-10 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(0 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(10 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(20 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(30 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(40 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(50 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(60 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(70 148.5 151.5)"/>
    <use xlink:href="#ten_degrees" transform="rotate(80 148.5 151.5)"/>
    <use xlink:href="#ten" transform="rotate(90 148.5 151.5)"/>
  </g>
  <g class="numbers">
    <text x="29.50" y="153.05">+90°</text>
    <text x="31.31" y="132.39">+80°</text>
    <text x="36.68" y="112.35">+70°</text>
    <text x="45.44" y="93.55">+60°</text>
    <text x="57.34" y="76.56">+50°</text>
    <text x="72.01" y="61.89">+40°</text>
    <text x="89.00" y="49.99">+30°</text>
    <text x="107.80" y="41.23">+20°</text>
    <text x="127.84" y="35.86">+10°</text>
    <text x="148.50" y="34.05">0°</text>
    <text x="169.16" y="35.86">−10°</text>
    <text x="189.20" y="41.23">−20°</text>
    <text x="208.00" y="49.99">−30°</text>
    <text x="224.99" y="61.89">−40°</text>
    <text x="239.66" y="76.56">−50°</text>
    <text x="251.56" y="93.55">−60°</text>
    <text x="260.32" y="112.35">−70°</text>
    <text x="265.69" y="132.39">−80°</text>
    <text x="267.50" y="153.05">−90°</text>
  </g>

  <g fill="none" stroke="#566169" stroke-width="0.27">
    <path d="M 14 38 V 154"/>
    <path d="M 37.5 151.5 H 259.5" stroke-dasharray="3 2"/>
    <path d="M 148.5 47 V 143" stroke-dasharray="6 2 1 2"/>
  </g>
  <text x="20" y="146" transform="rotate(-90 20 146)" class="small">固定参考线　∥　0° 正前方</text>
  <g fill="none" stroke="#20262b">
    <circle cx="148.5" cy="151.5" r="2.4" stroke-width="0.32"/>
    <path d="M 140 151.5 H 157 M 148.5 143 V 160" stroke-width="0.44"/>
  </g>
  <text x="148.5" y="166" text-anchor="middle" class="note">底座转轴中心</text>

  <path d="M 14 172.5 H 283" stroke="#879198" stroke-width="0.26"/>
  <g class="note">
    <text x="14" y="181">对心　将中心十字对准底座转轴在纸面上的投影。</text>
    <text x="14" y="189.5">定向　沿选定的固定正前方对齐 0° 线，固定纸张。</text>
    <text x="14" y="198">读数　从轴心沿转动件指针的方向读外圈交点。</text>
  </g>
  <text x="175" y="181" class="note">打印选“实际大小 / 100%”，用直尺核对两端。</text>
  <g fill="none" stroke="#20262b" stroke-width="0.35">
    <path d="M 175 193.5 H 275"/>
    <path d="M 175 187.5 V 193.5 M 185 189.5 V 193.5 M 195 189.5 V 193.5 M 205 189.5 V 193.5 M 215 189.5 V 193.5 M 225 187.5 V 193.5 M 235 189.5 V 193.5 M 245 189.5 V 193.5 M 255 189.5 V 193.5 M 265 189.5 V 193.5 M 275 187.5 V 193.5"/>
  </g>
  <g text-anchor="middle" class="small">
    <text x="175" y="199.3">0</text>
    <text x="225" y="199.3">50</text>
    <text x="275" y="199.3">100 mm</text>
  </g>
</svg>
